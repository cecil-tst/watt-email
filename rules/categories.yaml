# Taxonomia y reglas (fuente de verdad). Version 1: decisiones de Cecil del 2026-11-12 sobre la ficha de validacion
# (proposals/2026-11-10-validacion.json). FASE 1: ninguna regla se ejecuta todavia; son la base de la fase 2.
# Vocabulario: fase2 = etiquetar | archivar | mantener en bandeja | pseudo-snooze | Sensible; fase4 = acciones sobre adjuntos/pagos.
version: 1
estado: decisiones-cecil-2026-11-12
categorias:
  - id: spam
    nombre: "Spam"
  - id: newsletters
    nombre: "Newsletters"
  - id: info-servicio
    nombre: "Info de mantenimiento/servicio"
  - id: conversaciones
    nombre: "Conversaciones personales/profesionales"
  - id: ofertas-comerciales
    nombre: "Ofertas comerciales de servicios"
  - id: alertas
    nombre: "Alertas (seguridad, banco, plataformas)"
  - id: recordatorios-suscripcion
    nombre: "Recordatorios de suscripción/renovación"
  - id: pagos-cobros
    nombre: "Pagos y cobros"
  - id: facturas-proveedores
    nombre: "Facturas de proveedores"
  - id: facturas-saas
    nombre: "Facturas de software/SaaS"
  - id: bancos
    nombre: "Bancos"
  - id: impuestos
    nombre: "Impuestos/AEAT/gestoría"
  - id: cuentas-usuario
    nombre: "Gestión de cuentas de usuario"
  - id: administracion-publica
    nombre: "Administración pública (AEAT, CSUC, Generalitat…)"
  - id: otros
    nombre: "Otros"
etiquetas_usuario:  # decisiones c32-c35
  respetar: [TST/HOLA, TFT/Hola, TFT, TST]   # dimension entidad/alias; WATT anade etiqueta WATT/<categoria>, nunca en su lugar (c32=A)
  facturas: {Facturas: 'mapear a facturas-proveedores o facturas-saas segun remitente', '__POR PAGAR': 'estado de flujo, no tocar', '__POR CONCILIAR': 'estado de flujo, no tocar'}   # c33=B
  filtros_ruido: {'[NO REVISION]': newsletters/info-servicio, '_NO_REVISION_': newsletters/info-servicio, TST/SPAMDIGEST: newsletters, TFT/SPAMDIGEST: newsletters, Siteground: facturas-saas/info-servicio, '[Wordfence Alert]': alertas/info-servicio}   # c34=A
  gestoria: {GESTOR: impuestos, GESTOR/Impuestos: impuestos, GESTOR/Nominas: impuestos}   # c35=A
  fuera_de_alcance: ['CLIENTE/*', 'DEV/*', Vice, ICM, 'El Palomar', Trello, Boomerang*, JOAN]   # c35=A
parametros:
  reenvio_holded:   # decision Cecil 2026-11-12: que mensajes SI se reenvian a Holded en fase 4 (segun fecha de recepcion)
    facturas-saas: {desde: '2026-07-01'}              # recibidas desde el 1-jul-2026 (inclusive): reenviar; anteriores: no
    facturas-proveedores: {despues_de: '2026-11-01'}  # hasta el 1-nov-2026 NO se reenvian; solo las posteriores (CONFIRMADO por Cecil 2026-11-12)
  holded_inbox: wearethetellerssl@holdedbox.com   # buzon de ingesta de Holded; Cecil autorizo guardarlo aqui y reenviar solo facturas (excepcion regla 3, fase 4)
reglas:
  - {caso: c01, match: "from:correo.aeat.es", categoria: administracion-publica, fase2: "etiquetar; mantener en bandeja", fase4: "PDF -> Drive/Impuestos"}
  - {caso: c02, match: "from:cve-advocats.com", categoria: impuestos, fase2: "etiquetar (GESTOR); mantener en bandeja", fase4: "adjuntos PDF -> Drive/Gestoria"}
  - {caso: c03, match: "from:plataforma.contractacio@gencat.cat", categoria: info-servicio, fase2: "etiquetar + archivar", fase4: "-"}
  - {caso: c04, match: "from:Consorci de Serveis Universitaris de Catalunya", categoria: info-servicio, fase2: "etiquetar + archivar", fase4: "-  # RIESGO: asuntos 'IMPORTANT: Avis de notificacio' pueden traer plazo; revisar tras 1 mes"}
  - {caso: c05, match: "avisos puntuales: Junta AFA, Mosyle, Sanity, Registradores", categoria: recordatorios-suscripcion, fase2: "etiquetar + pseudo-snooze hasta fecha de caducidad", fase4: "manual (Cecil)"}
  - {caso: c09, match: "from:Holded (equipo, marketing); soporte -> info-servicio", categoria: newsletters, fase2: "etiquetar + archivar", fase4: "-"}
  - {caso: c11, match: "from:no-reply@the-storytellers.es subject:CONTACTO WEB", categoria: ofertas-comerciales, fase2: "etiquetar; mantener 1 mes en bandeja y revisar leads", fase4: "-"}
  - {caso: c13, match: "from:openarms.es + recibos PayPal", categoria: pagos-cobros, fase2: "recibos: etiquetar + archivar; boletin: newsletters", fase4: "recibo -> Drive/Donaciones"}
  - {caso: c14, match: "from:Justicia Alimentaria (via grupo)", categoria: newsletters, fase2: "etiquetar + archivar", fase4: "-"}
  - {caso: c16, match: "captacion en frio (remitentes sueltos, alias cecil.servan@)", categoria: ofertas-comerciales, fase2: "etiquetar + archivar", fase4: "-"}
  - {caso: c17, match: "contactos sueltos: crg.eu, canal.es", categoria: conversaciones, fase2: "etiquetar; mantener en bandeja", fase4: "-"}
  - {caso: c18, match: "hilo 1a0f…8834 (credenciales UB)", categoria: otros, fase2: "archivar con etiqueta Sensible (crear etiqueta)", fase4: "-"}
  - {caso: c19, match: "newsletters alta frecuencia: IA Hub, Atlassian marketing, John Turner/WPVibe, SiteGround Web Hosting, Emexs, OpenAI Ads, Claude Team", categoria: newsletters, fase2: "etiquetar; dejar en bandeja; proponer baja (confirmacion individual)", fase4: "baja manual (Cecil)"}
  - {caso: c20, match: "from:noreply@po.atlassian.net", categoria: info-servicio, fase2: "etiquetar + archivar", fase4: "-"}
  - {caso: c21, match: "codigos 2FA/verificacion: GitHub, Vercel, Holded, WPVibe, ChatGPT, Link", categoria: cuentas-usuario, fase2: "etiquetar + archivar", fase4: "-"}
  - {caso: c22, match: "from:noreply@github.com, system@vercel.com", categoria: alertas, fase2: "etiquetar + archivar", fase4: "-"}
  - {caso: c23, match: "informes DMARC (admin@thefoodtellers.com)", categoria: info-servicio, fase2: "etiquetar + archivar", fase4: "-"}
  - {caso: c24, match: "from:workspace-noreply@google.com, cloudplatform-noreply@google.com, sc-noreply@google.com", categoria: info-servicio, fase2: "etiquetar + archivar", fase4: "-"}
  - {caso: c25, match: "from:no-reply@cdmon.com", categoria: recordatorios-suscripcion, fase2: "etiquetar + pseudo-snooze hasta 48 h antes de la caducidad; ultimo aviso en bandeja (valorar Calendar con aviso 48 h: ver pendientes)", fase4: "pago manual (Cecil)"}
  - {caso: c26, match: "from:'SiteGround' via hola@ subject:renovacion", categoria: facturas-saas, fase2: "etiquetar (Facturas) + archivar", fase4: "reenviar el mensaje con adjunto/recibo/factura a parametros.holded_inbox (excepcion regla 3, solo fase 4, con lista aprobada)"}
  - {caso: c27, match: "recibos SaaS: Google Payments, Dropbox (txn), Metricool, Canva, SumUp", categoria: facturas-saas, fase2: "etiquetar (Facturas) + archivar", fase4: "reenviar el mensaje con adjunto/recibo/factura a parametros.holded_inbox (excepcion regla 3, solo fase 4, con lista aprobada)"}
  - {caso: c28, match: "from:stripe.com (Anthropic)", categoria: facturas-saas, fase2: "etiquetar (Facturas) + archivar", fase4: "reenviar el mensaje con adjunto/recibo/factura a parametros.holded_inbox (excepcion regla 3, solo fase 4, con lista aprobada)"}
  - {caso: c29, match: "from:rafa (via grupo), growth-lab.es, rmdisseny.es", categoria: facturas-proveedores, fase2: "etiquetar (Facturas + __POR PAGAR); mantener hasta pago", fase4: "reenviar el mensaje con adjunto/recibo/factura a parametros.holded_inbox (excepcion regla 3, solo fase 4, con lista aprobada)"}
  - {caso: c31, match: "from:nacho@the-storytellers.es, Nacho Ballesta; Trello -> info-servicio", categoria: conversaciones, fase2: "etiquetar; mantener en bandeja", fase4: "-"}
  - caso: c06
    match: "from:noreply@tm.openai.com"
    por_asunto:
      - {asunto: "credit balance has been reloaded|auto-reload", categoria: pagos-cobros, fase2: "etiquetar + archivar"}
      - {asunto: "out of credits|Add credits|credits remaining|requested more usage", categoria: alertas, fase2: "etiquetar + archivar"}
      - {asunto: "Business subscription renews soon", categoria: recordatorios-suscripcion, fase2: "etiquetar; mantener en bandeja hasta renovar"}
      - {asunto: "exportacion de datos|access to your account was updated|Your ChatGPT code is", categoria: cuentas-usuario, fase2: "etiquetar + archivar"}
  - caso: c07
    match: "from:support@dreamhost.com"
    por_asunto:
      - {asunto: "Domain Name Renewal Receipt|renewal success|PayPal AutoPay Payment Receipt", categoria: facturas-saas, fase2: "etiquetar + archivar; recibo PDF -> Drive/Facturas"}
      - {asunto: "Domain Renewal Notice", categoria: recordatorios-suscripcion, fase2: "etiquetar; mantener ultimo aviso"}
      - {asunto: "database server|Update passwords for all users", categoria: info-servicio, fase2: "etiquetar + archivar"}
  - caso: c08
    match: "from:no-reply@send.holded.com"
    por_asunto:
      - {asunto: "Factura A-", categoria: facturas-proveedores, fase2: "etiquetar (Facturas + __POR PAGAR); mantener hasta pago; registrar en Holded"}
      - {asunto: "Codigo de verificacion (2FA)", categoria: cuentas-usuario, fase2: "etiquetar + archivar"}
  - caso: c10
    match: "from:wordpress@* (Wordfence)"
    por_asunto:
      - {asunto: "Problems found|Acceso de administracion|recuperacion de contrasena", categoria: alertas, fase2: "etiquetar; mantener en bandeja"}
      - {asunto: "Actividad de Wordfence|Pendientes de moderacion", categoria: info-servicio, fase2: "etiquetar + archivar"}
      - {asunto: "Restablecer la contrasena", categoria: cuentas-usuario, fase2: "etiquetar + archivar"}
  - caso: c12
    match: "from:paypal via grupo"
    por_asunto:
      - {asunto: "Recibo de su pago", categoria: pagos-cobros, fase2: "etiquetar + archivar; recibo -> Drive/Pagos"}
      - {asunto: "(resto)", categoria: newsletters, fase2: "etiquetar + archivar"}
  - caso: c15
    match: "particulares gmail/outlook/otros"
    por_asunto:
      - {asunto: "candidatura|internship|application|practicas", categoria: otros, fase2: "etiquetar; mantener en bandeja"}
      - {asunto: "(resto)", categoria: conversaciones, fase2: "etiquetar; mantener en bandeja"}
  - caso: c30
    match: "from:bbva"
    por_asunto:
      - {asunto: "from:comunica.bbva.com", categoria: ofertas-comerciales, fase2: "etiquetar + archivar"}
      - {asunto: "from:notificaciones-bbva*", categoria: bancos, fase2: "etiquetar; mantener en bandeja"}
  - {caso: f01-f03, match: "Ivan Berbel (ivanberbel.com y gmail del mismo nombre); aiavisuals.com; Claudia Marti Llado (gmail)", categoria: facturas-proveedores, fase2: "etiquetar (Facturas) + archivar", fase4: "reenviar a holded_inbox solo si recibido despues del 2026-11-01"}
  - {caso: f05, match: "Joan Aguade via grupo hola@", categoria: facturas-proveedores, fase2: "etiquetar (Facturas) + archivar", fase4: "reenviar a holded_inbox solo si recibido despues del 2026-11-01"}
  - {caso: f04, match: "xdesign.barcelona (decidido por Cecil 2026-11-12: proveedor)", categoria: facturas-proveedores, fase2: "etiquetar (Facturas) + archivar", fase4: "reenviar a holded_inbox solo si recibido despues del 2026-11-01"}
  - {caso: f06, match: "danielgmoreno.com", categoria: facturas-proveedores, fase2: "etiquetar (Facturas) + archivar", fase4: "reenviar a holded_inbox solo si recibido despues del 2026-11-01"}
decisiones_lote2:  # Cecil 2026-11-12 («apruebo 1-41»)
  - CSUC (enotum.cat) y gencat plataforma.contractacio (expediente E2343): sin nada pendiente; archivar todo lo existente (incluidos los sin leer). Regla c03/c04 sigue vigente para lo futuro.
  - Atlassian marketing (noreply@po.atlassian.net): tratado por c20 (info-servicio + archivar).
  - Facturas de Holded (no-reply@mail.holded.com, eu.holded.com: WELOFT/Ignasi Rodriguez, AETERNUM Kit Digital): facturas-proveedores + etiqueta Facturas + archivar; las existentes estan gestionadas y tramitadas (no se toca __POR PAGAR). Aplica a lo anterior a 2026-11-12; lo futuro: preguntar si cambia el criterio de archivo.
  - Invitacion Holded a ai@: cuentas-usuario + archivar. Conversaciones internas (Nacho): conversaciones.
decisiones_lote4:  # Cecil 2026-11-12 («apruebo 1-32»)
  - BBVA promociones (bbva@comunica.bbva.com): ofertas-comerciales + archivar. FASE 4: darse de baja de la lista (confirmacion individual, regla 4; baja manual o por enlace de baja).
  - Boletines de Canva (start@engage.canva.com): FASE 4: darse de baja (confirmacion individual). Sin etiquetar todavia (esperan decision de grupo).
  - WATT/bancos y WATT/pagos-cobros: lo recibido HASTA el 2026-11-09 (incluido) se etiqueta y archiva; lo recibido DESDE el 2026-11-10 y a futuro se etiqueta pero SE MANTIENE EN BANDEJA. Sustituye a «etiquetar + archivar» de pagos-cobros en c06/c12/c13.
decisiones_lote5:  # Cecil 2026-11-12/13. EJECUTADO el 2026-11-13 (apruebo A-F): grupos A-F aplicados; GESTOR/Impuestos eliminada el 2026-11-13
  - Correos de sistema WordPress/Wordfence: etiquetar y archivar todo como leido, tambien lo futuro, salvo algo muy preocupante (alta de usuario, cambios de contrasena, fallos de actualizacion se avisan antes de archivar).
  - AEAT (correo.aeat.es, label WATT/administracion-publica): hasta el 2026-09-30 inclusive etiquetar y archivar como leido; desde el 2026-10-01 y a futuro: etiquetar, marcar NO LEIDO y mantener en bandeja.
  - Gestoria (cve-advocats.com): todos con la etiqueta GESTOR; los claramente de impuestos ademas WATT/impuestos. La etiqueta GESTOR/Impuestos se elimina para siempre (redundante): primero pasar sus hilos a GESTOR + WATT/impuestos y borrar la etiqueta solo con confirmacion individual de Cecil (regla 4). Pendiente de detalle y de decidir archivo/bandeja.
  - Holded (send.holded.com): facturas existentes facturas-proveedores + Facturas + archivar leido; codigos de verificacion (2FA) existentes cuentas-usuario + archivar leido. Desde el 2026-11-13: los codigos de verificacion (de cualquier remitente) se etiquetan cuentas-usuario pero NO se archivan.
  - Boletines de alta frecuencia (c19): hasta el 2026-11-09 inclusive WATT/newsletters + archivar leido; despues (supuesto, a confirmar): etiquetar y mantener en bandeja. Excluir de la regla por remitente los codigos de acceso, recibos y conversaciones.
  - Avisos puntuales con caducidad (c05): no siempre son suscripciones; hay que leer el detalle de cada uno antes de clasificar (lote 6).
  - Respuestas de Cecil 2026-11-13: avisos de seguridad de WordPress legitimos (se archivan); se aprueba por GRUPO (criterio + recuento + excepciones); gestoria: hasta 2026-10-31 archivar como leido, despues SOLO etiquetar, marcar NO LEIDO y mantener en bandeja; boletines desde 2026-11-10 se quedan en bandeja; GESTOR/Impuestos eliminada (49 hilos migrados a GESTOR + WATT/impuestos).
  - Supuesto a confirmar: la fecha de corte se aplica a la fecha del ultimo mensaje del hilo.
  - Nota operativa: para dejar un hilo «no leido» se marca solo el mensaje recibido; marcar el hilo entero deja tambien sin leer los mensajes enviados por Cecil (corregido el 2026-11-13). Fecha de corte = ultimo mensaje del hilo.
pendientes:
  - c25 Calendar: conector disponible (2026-11-12). Cecil acepta que Claude PROPONGA eventos con aviso 48 h antes; no se crean sin aprobacion de una lista concreta. Calendarios validos: cecil@the-storytellers.es y WATT PAGOS. La fecha de caducidad esta en el cuerpo (leer solo esos avisos).
  - c04 archiva avisos de notificacion con asunto IMPORTANT: revisar a los 30 dias que no se pierda ningun plazo (aprobado por Cecil).
  - c19 la baja de listas es siempre confirmacion individual (regla 4).
  - f04 (xdesign.barcelona): RESUELTO 2026-11-12, proveedor (regla f04).
  - Confirmado por Cecil 2026-11-12: facturas de proveedores anteriores al 2 nov 2026 no se reenvian, las posteriores si.
