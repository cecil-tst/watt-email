}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171d26; --fg:#e7ebf0; --muted:#98a3b3; --line:#2b3441;
  --accent:#4cc3b5; --accent-fg:#06201d; --accent-soft:#12302d;

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-text);font-size:15px;line-height:1.45;

.wrap{max-width:760px;margin:0 auto}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--bg);border:0;padding:8px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lead{margin:16px 0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;display:grid;gap:10px;min-width:0}
.card.done{border-color:var(--done)}
.head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.head h2{font:600 16px/1.25 var(--font-head);margin:0;min-width:0;overflow-wrap:anywhere}
.id{font:600 12px var(--font-mono);background:var(--accent-soft);color:var(--accent);padding:3px 7px;border-radius:6px;flex:none}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--rec-soft);color:var(--rec);flex:none}
.card.done .pill{background:var(--done-soft);color:var(--done)}
.pat{font:12px/1.4 var(--font-mono);color:var(--muted);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-variant-numeric:tabular-nums}
.ej{font-size:13px;border-left:3px solid var(--line);padding-left:8px;color:var(--muted);overflow-wrap:anywhere}
.cat{font-size:12px;color:var(--muted)}
.cat b{color:var(--fg)}
details.reglas{font-size:13px}
details.reglas summary{cursor:pointer;color:var(--accent)}
.reglas ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.reglas li span{color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:3px;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font:600 13px var(--font-mono);color:var(--accent)}
.opt .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.opt .c{font-weight:600}
.opt .a{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.badge{font-size:11px;background:var(--rec-soft);color:var(--rec);padding:1px 7px;border-radius:99px}
.otra textarea{width:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:64px;resize:vertical}
.nota{font-size:13px;color:var(--muted)}
.foot{display:flex;gap:8px;justify-content:flex-end}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.empty{text-align:center;color:var(--muted);padding:32px 0}
.export{display:grid;gap:8px;margin:20px 0}
.export label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.export textarea{width:100%;min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 var(--font-mono)}
.msg{font-size:13px;color:var(--done);min-height:18px}
@media (prefers-reduced-motion:reduce){.meter>i{transition:none}}

<div class="wrap">
  <header class="bar"><div class="bar-in">
    <h1>Validación WATT · fase 1</h1>
    <div class="prog"><span><b id="n-done">0</b> / <b id="n-all">0</b> decididos</span><div class="meter"><i id="meter"></i></div></div>

      <div class="seg" role="group" aria-label="Filtrar por estado">
        <button type="button" data-st="all" aria-pressed="true">Todos</button>
        <button type="button" data-st="pend" aria-pressed="false">Pendientes</button>
        <button type="button" data-st="done" aria-pressed="false">Decididos</button>
      </div>
    </div>
  </div></header>

  <p class="lead">Una ficha por patrón. La opción marcada con «Recomendada» viene preseleccionada. Toca una opción para decidir, o «Confirmar» para aceptar la que ves. Tus elecciones se guardan en este navegador. Aquí no hay cuerpos de email ni datos sensibles.</p>
  <main id="list"></main>

  <section class="export" aria-label="Copiar decisiones">
    <label><input type="checkbox" id="inc-pend"> Incluir los pendientes con la opción recomendada</label>
    <button type="button" class="btn" id="copy">Copiar decisiones</button>
    <div class="msg" id="msg" role="status"></div>
    <textarea id="out" readonly aria-label="Decisiones en texto compacto" placeholder="Aquí aparece el texto para pegar en la sesión."></textarea>
    <div><button type="button" class="btn ghost" id="reset">Borrar mis selecciones</button></div>
  </section>
</div>

    b.appendChild(t);b.appendChild(el('div','a','Fase 2: '+o.f2));
    if(o.f4&&o.f4!=='—')b.appendChild(el('div','a','Fase 4: '+o.f4));
    b.addEventListener('click',function(){state.sel[c.id]=o.k;state.done[c.id]=true;save();render(c.id);});
    os.appendChild(b);
  });
  var ob=el('div','opt otra');ob.setAttribute('role','group');
  var ot=el('button','opt');ot.type='button';ot.setAttribute('aria-pressed',String(sel==='otra'));
  var t2=el('div','t');t2.appendChild(el('span','k','otra'));t2.appendChild(el('span','c','Otra (texto libre)'));
  ot.appendChild(t2);
  ot.addEventListener('click',function(){state.sel[c.id]='otra';save();render(c.id,true);});
  os.appendChild(ot);
  if(sel==='otra'){
    var ta=el('textarea');ta.id='otra-'+c.id;ta.placeholder='Qué categoría y qué acción en fase 2 / fase 4';
    ta.value=state.otra[c.id]||'';
    ta.addEventListener('input',function(){state.otra[c.id]=ta.value;save();});
    ta.addEventListener('blur',function(){if((state.otra[c.id]||'').trim()){state.done[c.id]=true;save();updateTop();}});
    os.appendChild(ta);
  }
  a.appendChild(os);
  if(c.nota)a.appendChild(el('div','nota',c.nota));
  var f=el('div','foot');
  if(d){var u=el('button','btn ghost','Deshacer');u.type='button';u.addEventListener('click',function(){delete state.done[c.id];save();render(c.id);});f.appendChild(u);}
  else{var k=el('button','btn','Confirmar '+(sel==='otra'?'otra':sel));k.type='button';
    k.addEventListener('click',function(){state.sel[c.id]=sel;state.done[c.id]=true;save();render(c.id);});f.appendChild(k);}
  a.appendChild(f);
  return a;
}

function visible(c){
  if(flt.cat!=='all'&&c.categoria!==flt.cat)return false;
  var d=!!state.done[c.id];
  if(flt.st==='pend'&&d)return false;
  if(flt.st==='done'&&!d)return false;
  return true;
}
function updateTop(){
  var n=DATA.casos.length,d=0;DATA.casos.forEach(function(c){if(state.done[c.id])d++;});
  document.getElementById('n-done').textContent=d;document.getElementById('n-all').textContent=n;
  document.getElementById('meter').style.width=(n?100*d/n:0)+'%';
}
function render(focusId,focusText){
  var y=window.scrollY;var list=document.getElementById('list');list.textContent='';
  var shown=DATA.casos.filter(visible);
  shown.forEach(function(c){list.appendChild(card(c));});
  if(!shown.length)list.appendChild(el('div','empty','Ningún caso con este filtro.'));
  updateTop();
  if(focusText&&focusId){var t=document.getElementById('otra-'+focusId);if(t)t.focus();}
  window.scrollTo(0,y);
}

function compact(){
  var inc=document.getElementById('inc-pend').checked,parts=[];
  DATA.casos.forEach(function(c){
    var s=cur(c);
    if(state.done[c.id]||inc){
      if(s==='otra'){var tx=(state.otra[c.id]||'').replace(/'/g,'’').replace(/\s+/g,' ').trim();parts.push(c.id+"=otra:'"+tx+"'");}
      else parts.push(c.id+'='+s);
    }
  });
  return parts.join('; ');
}
function copy(){
  var txt=compact(),out=document.getElementById('out'),msg=document.getElementById('msg');
  out.value=txt;
  if(!txt){msg.textContent='Todavía no hay decisiones que copiar.';return;}
  function fallback(){out.focus();out.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    msg.textContent=ok?'Copiado. Pégalo en la sesión.':'Selecciona el texto de abajo y cópialo a mano.';}
  try{navigator.clipboard.writeText(txt).then(function(){msg.textContent='Copiado. Pégalo en la sesión.';},fallback);}catch(e){fallback();}
}

document.getElementById('copy').addEventListener('click',copy);
document.getElementById('inc-pend').addEventListener('change',function(){document.getElementById('out').value=compact();});
document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){
  flt.st=b.getAttribute('data-st');document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});render();});});
var rb=document.getElementById('reset');
rb.addEventListener('click',function(){
  if(!resetArmed){resetArmed=true;rb.textContent='Toca otra vez para borrar todo';setTimeout(function(){resetArmed=false;rb.textContent='Borrar mis selecciones';},4000);return;}
  state={sel:{},otra:{},done:{}};save();resetArmed=false;rb.textContent='Borrar mis selecciones';document.getElementById('out').value='';render();});

load();fillCats();render();
})();
</script>
